name: Release & Package

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64 (MSVC)
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary_name: agentsync.exe
            archive_name: agentsync-x86_64-pc-windows-msvc.zip

          # Linux x86_64 (GNU)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary_name: agentsync
            archive_name: agentsync-x86_64-unknown-linux-gnu.tar.gz

          # macOS Intel (x86_64)
          - target: x86_64-apple-darwin
            os: macos-latest
            binary_name: agentsync
            archive_name: agentsync-x86_64-apple-darwin.tar.gz

          # macOS Apple Silicon (ARM64)
          - target: aarch64-apple-darwin
            os: macos-latest
            binary_name: agentsync
            archive_name: agentsync-aarch64-apple-darwin.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" dist/
          Copy-Item README.md, README_EN.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.archive_name }}"
          (Get-FileHash -Algorithm SHA256 -Path "${{ matrix.archive_name }}").Hash | Out-File -Encoding ascii "${{ matrix.archive_name }}.sha256"

      - name: Package binary (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" dist/
          chmod +x "dist/${{ matrix.binary_name }}"
          cp README.md README_EN.md LICENSE dist/
          tar -czvf "${{ matrix.archive_name }}" -C dist .
          if command -v sha256sum > /dev/null; then
            sha256sum "${{ matrix.archive_name }}" > "${{ matrix.archive_name }}.sha256"
          else
            shasum -a 256 "${{ matrix.archive_name }}" > "${{ matrix.archive_name }}.sha256"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            ${{ matrix.archive_name }}
            ${{ matrix.archive_name }}.sha256
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-package
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: release-assets
          merge-multiple: true

      - name: Display downloaded assets
        run: ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
