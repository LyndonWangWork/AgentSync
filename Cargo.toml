[package]
name = "agentsync"
version = "0.1.0"
edition = "2021"
license = "CC-BY-NC-SA-4.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
inquire = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
dirs = "5.0"
tiny_http = "0.12"
ureq = "2.10"
walkdir = "2.5"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
colored = "2.1"
rand = "0.8"
get_if_addrs = "0.5.3"
crossterm = "0.25"
